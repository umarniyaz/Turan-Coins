<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turan Coin</title>
    <script src='//libtl.com/sdk.js' data-zone='11561450' data-sdk='show_11561450'></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">₺</div>
                <span class="logo-text">Turan Coin</span>
            </div>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="premium-badge" id="premiumBadge" style="display:none;">👑</div>
            </div>
        </div>

        <div class="balance-section">
            <div class="balance-label">Toplam Bakiye</div>
            <div class="balance-row">
                <span class="balance-amount" id="coinBalance">0</span>
                <span class="balance-coin">COIN</span>
            </div>
            <div class="balance-tl" id="tlBalance">0.00 TL</div>
        </div>

        <div class="actions">
            <button class="btn-primary" id="watchAdBtn">Reklam İzle</button>
            <button class="btn-secondary" id="premiumBtn">👑</button>
        </div>

        <div class="ad-info">
            Bugün: <span id="adsWatched">0</span>/50
        </div>

        <div class="premium-card" id="premiumCard">
            <div class="premium-title">👑 Premium Aktif</div>
            <div class="premium-features">
                <span>1 Coin = 0.5 TL</span>
                <span>Sınırsız Reklam</span>
                <span>İstanbulkart</span>
            </div>
        </div>

        <div class="coin-rain" id="coinRain"></div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
