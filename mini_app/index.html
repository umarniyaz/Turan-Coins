<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turan Coin</title>
    <script src='//libtl.com/sdk.js' data-zone='11561450' data-sdk='show_11561450'></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">₺</div>
                <span class="logo-text">Turan Coin</span>
            </div>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="premium-badge" id="premiumBadge" style="display:none;">👑</div>
            </div>
        </div>

        <!-- Bakiye Kartı -->
        <div class="balance-card">
            <div class="balance-label">Toplam Bakiye</div>
            <div class="balance-amount">
                <span id="coinBalance">0</span>
                <span class="coin-icon">🪙</span>
            </div>
            <div class="balance-tl" id="tlBalance">0.00 TL</div>
        </div>

        <!-- Reklam Bölümü -->
        <div class="ad-section">
            <button class="ad-button" id="watchAdBtn">
                <span class="ad-icon">▶</span>
                <span>Reklam İzle</span>
                <span class="ad-reward">+1 Coin</span>
            </button>
            <div class="ad-info">
                <span>Bugün: <span id="adsWatched">0</span>/50</span>
                <span class="premium-unlimited" id="premiumUnlimited" style="display:none;">Sınırsız</span>
            </div>
        </div>

        <!-- Premium Kartı -->
        <div class="premium-card" id="premiumCard">
            <div class="premium-header">
                <span>👑 Premium Aktif</span>
                <span class="premium-status">5 Kat Kazanç</span>
            </div>
            <div class="premium-features">
                <span>🪙 Coin değeri: 0.5 TL</span>
                <span>∞ Sınırsız reklam</span>
                <span>🚌 İstanbulkart yükleme</span>
            </div>
        </div>

        <!-- Coin Animasyonu -->
        <div class="coin-rain" id="coinRain"></div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
